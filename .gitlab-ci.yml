# CI/CD сервиса рекомендаций.
#
#   lint      — ruff check (PEP8, pyflakes, isort, bugbear) + mypy
#   formating — ruff format --check (стиль black)
#   test      — pytest (отчёт JUnit виден в MR)
#   build     — сборка образа buildkit и push в GitLab Container Registry
#               с тегом коммита ($CI_COMMIT_SHORT_SHA)
#   save      — фиксация протестированного образа: на default-ветке
#               тег `latest`, на git-теге — тег релиза
#   deploy    — деплой сервиса + мониторинга на ВМ (docker compose по SSH);
#               модель сервис при старте скачивает из S3
#
# Секреты задаются в Settings → CI/CD → Variables (masked + protected),
# в репозитории их нет:
#   VM_HOST, VM_USER        — адрес ВМ и пользователь
#   SSH_PRIVATE_KEY         — тип File: приватный ключ для доступа к ВМ
#   VM_ENV_FILE             — тип File: содержимое .env для ВМ (S3, Grafana)
# Логин в Registry — встроенные $CI_REGISTRY_USER / $CI_REGISTRY_PASSWORD.

default:
  tags: [k8s]
  image: ghcr.io/astral-sh/uv:0.13.1-python3.12-bookworm

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  VENV_PATH: "$CI_PROJECT_DIR/.venv"
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

stages:
  - lint
  - formating
  - test
  - build
  - save
  - deploy

# Установка окружения через uv (кэшируется между джобами по requirements)
.python_env:
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.uv-cache]
  before_script:
    - uv venv --python 3.12 "$VENV_PATH"
    - source "$VENV_PATH/bin/activate"
    - uv pip install -r requirements-dev.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

ruff_lint:
  stage: lint
  extends: .python_env
  script:
    # отчёт для виджета Code Quality в MR, затем обычный вывод (он и роняет джобу)
    - ruff check --output-format=gitlab --output-file=ruff-report.json . || true
    - ruff check .
  artifacts:
    when: always
    reports:
      codequality: ruff-report.json

mypy:
  stage: lint
  extends: .python_env
  script:
    - mypy

ruff_format:
  stage: formating
  extends: .python_env
  script:
    - ruff format --check --diff .

pytest:
  stage: test
  extends: .python_env
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

build_image:
  stage: build
  image:
    name: moby/buildkit:v0.16.0-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --export-cache type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max \
        --import-cache type=registry,ref=$CI_REGISTRY_IMAGE:buildcache \
        --output type=image,name=$IMAGE_SHA,push=true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

save_image:
  stage: save
  image:
    name: gcr.io/go-containerregistry/crane/debug:v0.20.2
    entrypoint: [""]
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        crane tag "$IMAGE_SHA" "$CI_COMMIT_TAG"
      else
        crane tag "$IMAGE_SHA" latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

deploy_vm:
  stage: deploy
  image: alpine:3.20
  variables:
    DEPLOY_DIR: recsys
    COMPOSE: docker compose -f mlops/deploy/vm/docker-compose.yml --env-file .env
  environment:
    name: production-vm
    url: http://$VM_HOST:8000/docs
  before_script:
    - apk add --no-cache openssh-client tar
    - chmod 600 "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
    - SSH="ssh -i $SSH_PRIVATE_KEY $VM_USER@$VM_HOST"
  script:
    # конфиги compose / Prometheus / Grafana и .env (из CI-переменной) — на ВМ
    - $SSH "mkdir -p $DEPLOY_DIR"
    - tar czf - mlops/deploy/vm mlops/monitoring mlops/grafana | $SSH "tar xzf - -C $DEPLOY_DIR"
    - $SSH "umask 077 && cat > $DEPLOY_DIR/.env" < "$VM_ENV_FILE"
    # образ этого коммита из GitLab Registry
    - $SSH "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - $SSH "cd $DEPLOY_DIR && export APP_IMAGE=$IMAGE_SHA && $COMPOSE pull && $COMPOSE up -d --no-build --remove-orphans"
    # smoke-check: модель загружена, сервис отвечает 200
    - $SSH "curl -fsS --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:8000/health"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $VM_HOST
