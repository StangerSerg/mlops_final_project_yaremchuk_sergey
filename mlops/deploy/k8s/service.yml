# Сетевой доступ к инференс-сервису внутри кластера.
# Проверка снаружи: kubectl -n <ns> port-forward svc/recsys-api 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: recsys-api
  labels:
    app.kubernetes.io/name: recsys-api
    app.kubernetes.io/part-of: retail-recsys
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: recsys-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
