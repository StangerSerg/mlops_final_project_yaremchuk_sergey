# Airflow 2.10 (LocalExecutor + Postgres) для DAG препроцессинга.
#
# Запуск на ВМ из корня репозитория (параметры берутся из общего .env):
#   docker compose -f mlops/airflow/docker-compose.yaml --env-file .env up -d --build
# UI: http://<ВМ>:8080 (логин/пароль — AIRFLOW_ADMIN_USER / AIRFLOW_ADMIN_PASSWORD)
#
# Ключи S3 передаются только в airflow-init, который сохраняет их
# в Airflow Connection `s3_storage` (пароль шифруется AIRFLOW_FERNET_KEY).
# Webserver и scheduler видят только бакет и префикс.

x-airflow-common: &airflow-common
  build: .
  image: recsys-airflow:2.10.5
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # код проекта
    PYTHONPATH: /opt/airflow/project
    CONFIG_PATH: /opt/airflow/project/config/config.json
    PIPELINE_WORK_DIR: /opt/airflow/work
    # куда читать/писать в S3 (не секреты)
    S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    S3_PREFIX: ${S3_PREFIX:-yaremchuk_sergey_project}
    S3_RAW_DIR: ${S3_RAW_DIR:-raw_data}
    S3_PROCESSED_DIR: ${S3_PROCESSED_DIR:-processed_data}
  volumes:
    - ./preprocessing_data.py:/opt/airflow/dags/preprocessing_data.py:ro
    - ../../src:/opt/airflow/project/src:ro
    - ../../config:/opt/airflow/project/config:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-work:/opt/airflow/work
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --role Admin \
          --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Admin --email admin@example.com || true
        airflow connections delete s3_storage || true
        airflow connections add s3_storage \
          --conn-type aws \
          --conn-login "$${AWS_ACCESS_KEY_ID}" \
          --conn-password "$${AWS_SECRET_ACCESS_KEY}" \
          --conn-extra "{\"endpoint_url\": \"$${S3_ENDPOINT_URL}\", \"region_name\": \"$${S3_REGION}\"}"
        echo "Airflow init done"
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?set AIRFLOW_ADMIN_USER in .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db:
  airflow-logs:
  airflow-work:
