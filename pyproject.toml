[project]
name = "mlops_final_project_yaremchuk_sergey"
version = "0.1.0"
description = "Retail recommendation service: purchase probability with CatBoost + FastAPI"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "boto3~=1.40.69",
    "catboost~=1.2.8",
    "fastapi~=0.115.12",
    "joblib~=1.5.2",
    "numpy~=2.2.5",
    "pandas~=2.2.3",
    "pandera==0.24.0",
    "prometheus-client~=0.26.0",
    "pyarrow~=22.0.0",
    "pydantic==2.13.5",
    "pydantic-settings>=2.10",
    "scikit-learn~=1.6.1",
    "uvicorn~=0.34.2",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "mypy~=1.17.1",
    "pytest~=9.0.0",
    "pytest-mock~=3.15.1",
    "ruff>=0.12.10",
]

# ---------- ruff: линтер + форматтер (стиль black) ----------
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", ".uv-cache", "data", "models", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
fixable = ["ALL"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-идиома: Depends()/Query() в значениях по умолчанию
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests", "mlops"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
